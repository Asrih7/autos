<div class="intervinientes">
  <h2 class="step-title">Uso principal del vehículo</h2>

  <div class="uso-options">

    <bal-radio-group
    [value]="usoSeleccionado()"
    (balChange)="selectUso($any($event).detail)">
    <div class="uso-options">
      @for (opcion of opciones(); track opcion.value) {
        <bal-card class="uso-option">
          <div class="uso-option-header">
            <bal-radio [value]="opcion.value"></bal-radio>
            <span class="uso-label">{{ opcion.label }}</span>
          </div>
        </bal-card>
      }
    </div>
  </bal-radio-group>

  </div>
</div>
