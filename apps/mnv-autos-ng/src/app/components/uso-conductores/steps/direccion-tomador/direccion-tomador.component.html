

      <section class="w-8 flex flex-direction-column gap-normal bg-white border border-grey border-radius-normal p-normal">
  <bal-heading level="h3" visual-level="h4" class="mb-none text-blue">
    {{ titleKey | translate }}
  </bal-heading>

  <p class="text-body-small text-light mt-none text-blue">
    {{ subtitleKey | translate }}
  </p>

 <app-datos-domicilio-google
  [value]="model().domicilio"
  [placeholder]="placeholderKey | translate"
  [ariaLabel]="ariaLabelKey | translate"
  (addressSelected)="onAddressSelected($event)">
</app-datos-domicilio-google>


<app-datos-domicilio-form
  [model]="direccion()"
  [disabled]="formDisabled()"
  [fieldDisabled]="fieldDisabled()"
  (modelChange)="onFormChanged($event)">
</app-datos-domicilio-form>

</section>
