
<section class="w-6 flex flex-direction-column gap-normal bg-white mb-large">
  <bal-heading level="h3" visual-level="h4" class="mb-none text-blue">
    {{ 'usoConductores.intervinientes.address.title' | translate }}
  </bal-heading>

  <p class="text-body-small text-light mt-none text-blue">
    {{ 'usoConductores.intervinientes.address.subtitle' | translate }}
  </p>

  <app-datos-domicilio-google
    [value]="model().domicilio"
    (addressSelected)="onAddressSelected($event)"
    (clearSelection)="onGoogleCleared()">
  </app-datos-domicilio-google>

  <app-datos-domicilio-form
    [model]="direccion()"
    [disabled]="formDisabled()"
    (modelChange)="onFormChanged($event)"
    (codigoPostalChange)="onCodigoPostalChanged($event)">
  </app-datos-domicilio-form>

    @if (processing()) {
      <div class="overlay">
        <div class="overlay-content">
          <div class="spinner" aria-hidden="true"></div>
          <div class="overlay-text">Normalizando dirección...</div>
        </div>
      </div>
    }

  @if (toastOpen()) {
    <bal-toast
      [duration]="toastDurationMs"
      [color]="toastType()"
      (balClose)="toastOpen.set(false)">
      {{ toastMessage() }}
    </bal-toast>
  }
</section>

<style>
.overlay {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(255,255,255,0.85);
  z-index: 40;
}
.overlay-content {
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:0.75rem;
}
.spinner {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  border: 4px solid #eee;
  border-top-color: #2b87f0;
  animation: spin 1s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.overlay-text { font-size: 0.95rem; color: #1f2937; }
</style>
