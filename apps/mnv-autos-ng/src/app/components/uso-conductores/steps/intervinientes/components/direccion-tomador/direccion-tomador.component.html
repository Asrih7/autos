<section class="intervinientes">
  


  <h2 class="page-title">Dirección de residencia del tomador</h2>
    <h3 class="step-sub-title">La dirección completa influye en el cálculo de la prima</h3>

    <bal-select
      id="domicilio"
      class="direccion-select"
      data-testid="select-domicilio"
      [value]="model().domicilio"
      typeahead
      placeholder="Buscar dirección"
      (balInput)="searchQueryChanged($any($event).detail ?? $any($event))"
      (balChange)="onSelectChange($any($event))"
      aria-label="Buscar dirección del propietario">

     @if (suggestions()?.length) {
  @for (opt of suggestions(); track opt) {
    <bal-select-option [value]="opt" [label]="opt">{{ opt }}</bal-select-option>
  }
} @else {
  <bal-select-option
    value="Calle Mayor 1, 28013 Madrid"
    label="Calle Mayor 1, 28013 Madrid">
    Calle Mayor 1, 28013 Madrid
  </bal-select-option>

  <bal-select-option
    value="Plaza España 5, 28008 Madrid"
    label="Plaza España 5, 28008 Madrid">
    Plaza España 5, 28008 Madrid
  </bal-select-option>
}


    </bal-select>
</section>
