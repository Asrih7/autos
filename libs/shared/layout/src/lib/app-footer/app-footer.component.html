
<footer>
  <div class="uso-actions">
    
    @if (navService.showBackButton()) {
      <bal-button color="grey" (click)="navService.navigateBack()">
        {{ navService.backButtonLabel() }}
      </bal-button>
    }
    
    <bal-button
      color="green"
      [disabled]="!navService.canContinueNext()"
      (click)="navService.navigateNext()"
    >
      Continuar
    </bal-button>

  </div>
</footer>
