<footer>
  <div [class]="navService.useCustomClass() || 'uso-actions'">

    @if (navService.showBackButton()) {
    <bal-button color="grey" (click)="navService.navigateBack()">
      {{ navService.backButtonLabel() }}
    </bal-button>
    }

    @if (navService.showNextButton()) {
    <bal-button color="green" [disabled]="!navService.canContinueNext()" (click)="navService.navigateNext()">
      {{ navService.nextButtonLabel() }}
    </bal-button>
    }

  </div>
</footer>
