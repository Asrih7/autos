<nav class="sidebar-shell" aria-label="Menú principal">

  <button type="button" class="sidebar-back" (click)="goBack()">
      <bal-icon name="caret-left"></bal-icon>
      <span>Tu cotización</span>
  </button>

  <ul role="list">
    @for (item of items(); track item.id) {
     <li
  class="sidebar-nav-item"
  [class.sidebar-nav-item--active]="item.state === 'active'"
  [class.sidebar-nav-item--completed]="item.state === 'completed'"
  [class.sidebar-nav-item--disabled]="item.disabled"   
  (click)="navigate(item)"
>

        <div class="step-indicator">
<span class="step-circle">
  @switch (item.state) {
    @case ('completed') {
      <bal-icon name="check" size="small" class="step-check" color="auto" aria-hidden="true"></bal-icon>
    }
    @case ('active') {
      <span class="step-circle-dot"></span>
    }
    @default {
      <span class="step-circle-dot step-circle-dot--pending"></span>
    }
  }
</span>



          @if (!item.isLast) {
            <span class="step-line" [class.step-line--completed]="item.state === 'completed'"></span>
          }
        </div>

        <div class="nav-item-content">
          <span class="nav-item-label">{{ item.label }}</span>
        </div>
      </li>
    }
  </ul>

</nav>
