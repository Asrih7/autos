<section class="flex flex-direction-column gap-normal bg-white mb-large">
  <bal-heading level="h4" visual-level="h5" class="mb-none text-blue">
    Buscar dirección con Google
  </bal-heading>

  <bal-select
    class="w-6"
    id="domicilio-google"
    [value]="searchValue()"
    typeahead
    [placeholder]="placeholder"
    (balInput)="onInput($event)"
    (balChange)="onSelectChange($event)"
    [attr.aria-label]="placeholder">

    <bal-select-option
      *ngFor="let suggestion of filteredSuggestions()"
      [value]="suggestion"
      [label]="suggestion">
      {{ suggestion }}
    </bal-select-option>
  </bal-select>
</section>
