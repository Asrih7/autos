
<section class="flex flex-direction-column gap-normal bg-white mb-large">
  <bal-heading level="h4" visual-level="h5" class="mb-none text-blue">
    Buscar dirección con Google
  </bal-heading>

  <bal-dropdown
    class="w-8"
    id="domicilio-google"
    [placeholder]="placeholder"
    name="domicilio-google"
    autocomplete="street-address"
    [value]="selectedValue()"
    (balChange)="onSelectChange($event)"
  >
    @for (option of options(); track option.id) {
      <bal-option
        [value]="option.id"
        [label]="option.label">
        {{ option.label }}
      </bal-option>
    }
  </bal-dropdown>
</section>
