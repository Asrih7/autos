<section class="buscador-cliente">
  <bal-field [invalid]="error !== null">
    <bal-field-label>DNI, NIE o CIF*</bal-field-label>
    <bal-field-control>
      <bal-input
        autocomplete="off"
        placeholder="Ej. 11843928V"
        [value]="documento"
        (balInput)="onInput($event)"
      ></bal-input>
    </bal-field-control>
    @if (error)
    {
      <bal-field-message color="danger">{{ error }}</bal-field-message>
    }
  </bal-field>

  <bal-button class="w-full" [disabled]="documento.trim().length === 0 || searching" (click)="search()">
    {{ searching ? 'Buscando...' : 'Buscar cliente' }}
  </bal-button>
</section>
