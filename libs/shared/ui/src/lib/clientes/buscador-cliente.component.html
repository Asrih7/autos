<section class="w-12 mobile:w-8 flex flex-direction-column gap-small bg-white mb-large">
  <bal-field [invalid]="error !== null">
    <bal-field-label>DNI, NIE o CIF*</bal-field-label>

    <bal-field-control>
      <!-- Reducimos el gap aquí -->
      <div class="buttons bal-flex--gap-small w-12">

        <!-- INPUT (ocupa más espacio) -->
        <div class="bal-flex-grow w-10 mt-normal">
          <bal-input
            autocomplete="off"
            placeholder="Ej. 11843928V"
            [value]="documento"
            (balInput)="onInput($event)"
          ></bal-input>
        </div>

        <!-- BOTÓN (ocupa menos espacio) -->
        <div class="bal-flex-grow w-2 mt-normal bloque-accion buttons justify-content-end">
          <bal-button
            color="primary"
            [disabled]="documento.trim().length === 0 || searching"
            (click)="search()"
          >
            {{ searching ? 'Buscando...' : 'Buscar cliente' }}
          </bal-button>
        </div>

      </div>
    </bal-field-control>

    @if (error) {
      <bal-field-message color="danger">{{ error }}</bal-field-message>
    }
  </bal-field>
</section>
