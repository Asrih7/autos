<div class="w-full">
  <div class="bloque-busqueda mb-normal">
    <bal-field class="is-fullwidth">
      <bal-field-control>
        <bal-input
          [value]="filtroBusqueda()"
          (balInput)="filtroBusqueda.set($event.detail ?? '')"
          [placeholder]="placeholderBusqueda()"
          clickable="true"
          icon="search">
        </bal-input>
      </bal-field-control>
    </bal-field>
  </div>

  <div class="contenedor-catalogo-grid">
    <div class="grid is-multiline is-mobile">
      
      @for (item of itemsFiltrados(); track item.id) {
        <!-- 2 en móvil (is-half) | 4 en tablet (is-one-quarter) | 6 en escritorio (is-one-sixth) -->
        <div class="col mobile:is-half tablet:is-one-quarter desktop:is-one-sixth">
          
          <bal-card
            fullheight="true"
            class="tarjeta-marca-item"
            [class.is-seleccionada]="idSeleccionado() === item.id"
            (click)="seleccionarItem(item.id)"
            role="button"
            [tabindex]="0"
            (keydown.enter)="seleccionarItem(item.id)"
            (keydown.space)="$event.preventDefault(); seleccionarItem(item.id)">
            
            <bal-card-content>
              <div class="flex align-items-center justify-content-center flex-direction-column">
                <div class="flex align-items-center justify-content-center w-full mb-x-small">
                  <img [src]="item.logo" [alt]="item.nombre" class="max-h-full block" />
                </div>
                
                <span class="nombre-item text-small font-weight-bold">
                  {{ item.nombre }}
                </span>
                
              </div>
            </bal-card-content>

          </bal-card>

        </div>
      } @empty {
        <div class="col is-full py-large text-center text-light">
          {{ sinResultadosTexto() }}
        </div>
      }

    </div>
  </div>

</div>
