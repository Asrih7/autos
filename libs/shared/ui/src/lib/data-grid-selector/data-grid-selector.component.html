<div class="w-full">
  <div class="bloque-busqueda mb-normal flex-none">
    <bal-field class="is-fullwidth">
      <bal-field-control>
        <bal-input
          [value]="filtroBusqueda()"
          (balInput)="filtroBusqueda.set($event.detail ?? '')"
          [placeholder]="placeholderBusqueda()"
          clickable="true"
          icon="search">
        </bal-input>
      </bal-field-control>
    </bal-field>
  </div>

  <div class="contenedor-catalogo-grid pr-x-small flex-1 overflow-y-auto overflow-x-hidden" 
       style="max-height: 480px;">
    
    <div class="grid is-multiline is-mobile mx-none">
      
      @for (item of itemsFiltrados(); track item.id) {
        <div class="col mobile:is-half tablet:is-one-quarter desktop:is-one-sixth mb-x-small">
          
          <bal-card
            fullheight="true"
            class="tarjeta-marca-item"
            [class.is-seleccionada]="idSeleccionado() === item.id"
            (click)="seleccionarItem(item.id)"
            role="button"
            [tabindex]="0"
            (keydown.enter)="seleccionarItem(item.id)"
            (keydown.space)="$event.preventDefault(); seleccionarItem(item.id)">
            
            <bal-card-content>
              <div class="flex align-items-center justify-content-center flex-direction-column">
                <div class="flex align-items-center justify-content-center w-full mb-x-small" style="height: 40px;">
                  <img 
                    [src]="item.logo" 
                    [alt]="item.nombre" 
                    #brandLogo
                    (error)="brandLogo.src = 'assets/images/marcas/noexiste.png'"
                    class="max-h-full block" 
                    style="object-fit: contain;" 
                  />
                </div>
                
                <span class="nombre-item text-small font-weight-bold text-center w-full">
                  {{ item.nombre }}
                </span>
                
              </div>
            </bal-card-content>

          </bal-card>

        </div>
      } @empty {
        <div class="col is-full py-large text-center text-light">
          {{ sinResultadosTexto() }}
        </div>
      }

    </div>
  </div>

</div>
