<section class="w-full tablet:w-10 desktop:w-6 flex flex-direction-column gap-normal bg-white mb-large mobile:mb-normal tablet:mb-large">

  <bal-heading level="h3" visual-level="h4" class="mb-none text-blue">
    {{ 'usoConductores.fechaEfectoSeguro.title' | translate }}
  </bal-heading>

  <p class="text-body-small text-light mt-none text-blue">
    {{ 'usoConductores.fechaEfectoSeguro.subtitle' | translate }}
  </p>

  <bal-field class="block w-full">
    <bal-field-control>
      <div class="w-6 mobile:w-full flex align-end gap-small">
        <bal-input
          #diaInput
          name="dia"
          class="block"
          inputmode="numeric"
          maxlength="2"
          [placeholder]="'usoConductores.fechaEfectoSeguro.placeholders.day' | translate"
          [attr.aria-label]="'usoConductores.fechaEfectoSeguro.ariaLabels.day' | translate"
          [value]="dia()"
          (balInput)="onFechaInput($event, 'dia')"
          (balChange)="onFechaInput($event, 'dia')"
          (balBlur)="formatearDiaMes()"
        ></bal-input>

        <bal-input
          name="mes"
          class="block"
          inputmode="numeric"
          maxlength="2"
          [placeholder]="'usoConductores.fechaEfectoSeguro.placeholders.month' | translate"
          [attr.aria-label]="'usoConductores.fechaEfectoSeguro.ariaLabels.month' | translate"
          [value]="mes()"
          (balInput)="onFechaInput($event, 'mes')"
          (balChange)="onFechaInput($event, 'mes')"
          (balBlur)="formatearDiaMes()"
        ></bal-input>

        <bal-input
          name="anio"
          class="block"
          inputmode="numeric"
          maxlength="4"
          [placeholder]="'usoConductores.fechaEfectoSeguro.placeholders.year' | translate"
          [attr.aria-label]="'usoConductores.fechaEfectoSeguro.ariaLabels.year' | translate"
          [value]="anio()"
          (balInput)="onFechaInput($event, 'anio')"
          (balChange)="onFechaInput($event, 'anio')"
        ></bal-input>

      </div>

    </bal-field-control>

    @if (error()) {
      <bal-field-message color="danger">{{ error() }}</bal-field-message>
    }
  </bal-field>

</section>
